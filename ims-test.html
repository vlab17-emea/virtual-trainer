<script>
window.adobeid = {
  client_id: 'virtual-trainer-yukon-portal-web',
  scope: 'AdobeID,openid',

  environment: 'stg1',
  onAccessToken(t) { document.body.innerHTML += '<p>TOKEN: ' + (t.token || t) + '</p>'; },
