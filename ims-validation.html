
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IMS Test 6</title>
  <style>
    body { font-family: sans-serif; padding: 40px; max-width: 600px; }
    .result { margin: 10px 0; padding: 12px; border-radius: 6px; font-size: 14px; }
    .ok { background: #e8f5e9; color: #2e7d32; }
    .err { background: #fce4ec; color: #c62828; }
    .info { background: #e3f2fd; color: #1565c0; }
    button { padding: 10px 20px; background: #fa0f00; color: white; border: none;
             border-radius: 6px; cursor: pointer; font-size: 14px; margin: 5px 5px 0 0; }
  </style>
</head>
<body>
  <h2>IMS Auth Test 6</h2>
  <div id="log"></div>
  <div id="actions"></div>

  <script>
    /* Safe logger — works even if called before DOMContentLoaded */
    function log(msg, type) {
      function write() {
        const d = document.createElement('div');
        d.className = `result ${type || 'info'}`;
        d.textContent = msg;
        document.getElementById('log').appendChild(d);
      }
      if (document.getElementById('log')) {
        write();
      } else {
        document.addEventListener('DOMContentLoaded', write);
      }
    }

    function showSignIn() {
      const actions = document.getElementById('actions');
      if (!actions) return;
      actions.innerHTML = '';
      const btn = document.createElement('button');
      btn.textContent = 'Sign In';
      btn.onclick = () => {
        log('Initiating sign in (code flow)...', 'info');
        window.adobeIMS.signIn({}, undefined, 'code');
      };
      actions.appendChild(btn);
    }

    function showSignOut() {
      const actions = document.getElementById('actions');
      if (!actions) return;
      actions.innerHTML = '';
      const btn = document.createElement('button');
      btn.textContent = 'Sign Out';
      btn.onclick = () => window.adobeIMS.signOut();
      actions.appendChild(btn);
    }

    window.adobeid = {
      client_id: 'virtual-trainer-yukon-portal-web',
      scope: 'AdobeID,openid,read_organizations',
      locale: 'en_US',
      environment: 'stg1',
      uses_redirect_mode: true,
      redirect_uri: 'https://trainer.learn-adobe-ai.com/ims-validation.html',
      response_type: 'code',
      api_parameters: {
        authorize: {
          response_type: 'code',
          code_challenge_method: 'S256',
        },
      },
      onAccessToken(tokenInfo) {
        const token = typeof tokenInfo === 'string' ? tokenInfo : tokenInfo.token;
        log('✅ onAccessToken fired — token received!', 'ok');
        log('Token (first 60 chars): ' + token.substring(0, 60) + '...', 'ok');
        showSignOut();
      },
      onReady() {
        const signedIn = window.adobeIMS.isSignedInUser();
        log('onReady fired — signed in: ' + signedIn, 'info');
        if (signedIn) {
          showSignOut();
        } else {
          showSignIn();
        }
      },
      onError(e) {
        log('❌ IMS error: ' + JSON.stringify(e), 'err');
      },
      onSignOut() {
        log('Signed out successfully', 'info');
        showSignIn();
      },
    };
  </script>
  <script src="https://auth-stg1.services.adobe.com/imslib/imslib.min.js"></script>
</body>
</html>
